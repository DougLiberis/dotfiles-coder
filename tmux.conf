set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"

# Claude Code: let desktop notifications / progress bar escape sequences
# reach the outer terminal, and let tmux distinguish Shift+Enter from Enter.
# https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys:RGB:clipboard:focus:title:usstyle'

# Nested-terminal chain: WezTerm > zellij (locked) > ssh > tmux.
# Escape sequences (truecolor, OSC 52, focus) must survive all four hops.
# Advertise truecolor for every terminal type, not just xterm* — the
# default-terminal here is tmux-256color, which xterm* would not match.
set -as terminal-features ",*:RGB"
# Emit OSC 52 upward so yanks reach the Windows clipboard through ssh+zellij
# (tmux default is `external`; force `on`). Server option.
set -s set-clipboard on
# Snappier ESC handling in nvim, especially over the network hop. Server option.
set -s escape-time 10
# Let nvim autoread / autosave-on-focus-lost work across the chain. Server option.
set -s focus-events on

# Window/pane indexing from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Reloaded"

# Session persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run '~/.tmux/plugins/tpm/tpm'
